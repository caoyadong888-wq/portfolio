<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">LedgerLite request path</title>
  <desc id="desc">Ingress in the ingress-nginx namespace reaches the API Service. The API reaches either in-cluster Postgres or an external database. Prometheus scrapes the API. DNS egress goes to kube-system. A default-deny NetworkPolicy surrounds the application namespace.</desc>
  <rect width="980" height="560" fill="#f4f1ea"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="22" fill="#1c1917">LedgerLite on Kubernetes</text>
  <text x="24" y="58" font-family="sans-serif" font-size="13" fill="#44403c">Three namespaces plus an external database. Arrows are the NetworkPolicy allows. Vandelay Industries is fictional.</text>
  <rect x="24" y="84" width="200" height="120" rx="8" fill="#fff" stroke="#78716c"/>
  <text x="40" y="112" font-family="sans-serif" font-size="13" fill="#44403c">namespace</text>
  <text x="40" y="136" font-family="sans-serif" font-size="16" fill="#1c1917">ingress-nginx</text>
  <text x="40" y="162" font-family="sans-serif" font-size="13" fill="#44403c">Ingress class nginx</text>
  <text x="40" y="182" font-family="sans-serif" font-size="13" fill="#44403c">cert-manager issuer</text>
  <rect x="280" y="84" width="430" height="360" rx="8" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
  <text x="296" y="112" font-family="sans-serif" font-size="13" fill="#9a3412">namespace ledgerlite-&lt;env&gt; · default deny</text>
  <rect x="304" y="136" width="180" height="88" rx="6" fill="#fff" stroke="#1c1917"/>
  <text x="318" y="166" font-family="sans-serif" font-size="16" fill="#1c1917">Service</text>
  <text x="318" y="190" font-family="sans-serif" font-size="13" fill="#44403c">ClusterIP :8000</text>
  <rect x="508" y="136" width="180" height="88" rx="6" fill="#fff" stroke="#1c1917"/>
  <text x="522" y="166" font-family="sans-serif" font-size="16" fill="#1c1917">API pods</text>
  <text x="522" y="190" font-family="sans-serif" font-size="13" fill="#44403c">HPA · PDB · uid 10001</text>
  <rect x="304" y="260" width="384" height="70" rx="6" fill="#fff" stroke="#1c1917"/>
  <text x="318" y="290" font-family="sans-serif" font-size="16" fill="#1c1917">Postgres</text>
  <text x="318" y="312" font-family="sans-serif" font-size="13" fill="#44403c">dev: StatefulSet in this namespace · staging/prod: external</text>
  <rect x="304" y="348" width="384" height="70" rx="6" fill="#fff" stroke="#1c1917"/>
  <text x="318" y="376" font-family="sans-serif" font-size="16" fill="#1c1917">migrate Job</text>
  <text x="318" y="398" font-family="sans-serif" font-size="13" fill="#44403c">alembic upgrade head · Helm hook or Argo CD PreSync</text>
  <rect x="760" y="84" width="196" height="100" rx="8" fill="#fff" stroke="#78716c"/>
  <text x="776" y="112" font-family="sans-serif" font-size="13" fill="#44403c">namespace</text>
  <text x="776" y="136" font-family="sans-serif" font-size="16" fill="#1c1917">monitoring</text>
  <text x="776" y="160" font-family="sans-serif" font-size="13" fill="#44403c">scrape :8000 /metrics</text>
  <rect x="760" y="210" width="196" height="100" rx="8" fill="#fff" stroke="#78716c"/>
  <text x="776" y="238" font-family="sans-serif" font-size="13" fill="#44403c">namespace</text>
  <text x="776" y="262" font-family="sans-serif" font-size="16" fill="#1c1917">kube-system</text>
  <text x="776" y="286" font-family="sans-serif" font-size="13" fill="#44403c">kube-dns :53</text>
  <rect x="760" y="336" width="196" height="108" rx="8" fill="#fff" stroke="#78716c"/>
  <text x="776" y="364" font-family="sans-serif" font-size="13" fill="#44403c">external database</text>
  <text x="776" y="388" font-family="sans-serif" font-size="16" fill="#1c1917">10.8.0.0/16</text>
  <text x="776" y="412" font-family="sans-serif" font-size="13" fill="#44403c">placeholder CIDR</text>
  <line x1="224" y1="144" x2="304" y2="170" stroke="#9a3412" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="484" y1="180" x2="508" y2="180" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="598" y1="224" x2="500" y2="260" stroke="#1c1917" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="688" y1="180" x2="760" y2="140" stroke="#9a3412" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="688" y1="200" x2="760" y2="250" stroke="#9a3412" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="688" y1="300" x2="760" y2="380" stroke="#9a3412" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c1917"/>
    </marker>
  </defs>
</svg>
