# Source: ledgerlite/templates/backup-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ledgerlite-postgres-backup
  namespace: ledgerlite-dev
  labels:
    app.kubernetes.io/name: ledgerlite
    app.kubernetes.io/instance: ledgerlite
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: ledgerlite
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ledgerlite
            app.kubernetes.io/instance: ledgerlite
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: ledgerlite
        spec:
          restartPolicy: Never
          serviceAccountName: ledgerlite
          automountServiceAccountToken: false
          enableServiceLinks: false
          hostNetwork: false
          hostPID: false
          hostIPC: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: "postgres:16-alpine"
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  mkdir -p /backup
                  pg_dump --file="/backup/ledgerlite-${ts}.sql"
                  ls -1t /backup/ledgerlite-*.sql | awk 'NR>7' | while IFS= read -r old; do
                    rm -f "$old"
                  done
              env:
                - name: PGHOST
                  value: ledgerlite-postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: ledgerlite-dev-db
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ledgerlite-dev-db
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ledgerlite-dev-db
                      key: POSTGRES_DB
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "256Mi"
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              startupProbe:
                exec:
                  command: ["pg_dump", "--version"]
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 12
              livenessProbe:
                exec:
                  command: ["pg_dump", "--version"]
                periodSeconds: 20
                timeoutSeconds: 5
                failureThreshold: 3
              readinessProbe:
                exec:
                  command: ["pg_dump", "--version"]
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: ledgerlite-postgres-backup
            - name: tmp
              emptyDir: {}
