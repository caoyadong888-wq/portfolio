# Source: ledgerlite/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledgerlite-api
  namespace: ledgerlite-staging
  labels:
    app.kubernetes.io/name: ledgerlite
    app.kubernetes.io/instance: ledgerlite
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ledgerlite
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
