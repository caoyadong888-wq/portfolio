<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">CloudOps architecture</title>
  <desc id="desc">GitHub and Cloud Build push to Artifact Registry and Cloud Run. Secret Manager, IAM, and Monitoring sit beside the service. AWS Lambda is a dashed secondary box. Not deployed.</desc>
  <style>
    .box { fill: #ffffff; stroke: #3730a3; stroke-width: 2; }
    .side { fill: #eef0ff; stroke: #3730a3; stroke-width: 1.5; }
    .dash { fill: #fffaf3; stroke: #8a4b08; stroke-width: 2; stroke-dasharray: 7 5; }
    .label { font-family: system-ui, sans-serif; font-size: 15px; fill: #141824; }
    .small { font-family: system-ui, sans-serif; font-size: 12px; fill: #5c6578; }
    .arrow { stroke: #3730a3; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#3730a3"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#f7f8fb"/>
  <text class="label" x="32" y="36" font-size="20">CloudOps — GCP primary, AWS secondary</text>
  <text class="small" x="32" y="58">Offline configuration. Not deployed to any cloud account. Thistle Analytics is fictional.</text>

  <rect class="box" x="32" y="88" width="170" height="72" rx="10"/>
  <text class="label" x="48" y="118">GitHub Actions</text>
  <text class="small" x="48" y="140">WIF, id-token</text>

  <rect class="box" x="280" y="88" width="170" height="72" rx="10"/>
  <text class="label" x="296" y="118">Cloud Build</text>
  <text class="small" x="296" y="140">lint test build push</text>

  <rect class="box" x="528" y="88" width="190" height="72" rx="10"/>
  <text class="label" x="544" y="118">Artifact Registry</text>
  <text class="small" x="544" y="140">apps/insights-api</text>

  <rect class="box" x="760" y="200" width="188" height="92" rx="10"/>
  <text class="label" x="776" y="234">Cloud Run</text>
  <text class="small" x="776" y="256">insights-api</text>
  <text class="small" x="776" y="274">asia-east1 :8080</text>

  <path class="arrow" d="M202 124 H280"/>
  <path class="arrow" d="M450 124 H528"/>
  <path class="arrow" d="M623 160 V200 H760"/>

  <rect class="side" x="32" y="220" width="200" height="78" rx="10"/>
  <text class="label" x="48" y="250">Secret Manager</text>
  <text class="small" x="48" y="272">signing-key version 1</text>

  <rect class="side" x="260" y="220" width="200" height="78" rx="10"/>
  <text class="label" x="276" y="250">IAM service accounts</text>
  <text class="small" x="276" y="272">runtime, build, github</text>

  <rect class="side" x="488" y="220" width="220" height="78" rx="10"/>
  <text class="label" x="504" y="250">Cloud Monitoring</text>
  <text class="small" x="504" y="272">6 alert policies as code</text>

  <path class="arrow" d="M132 298 V360 H760"/>
  <path class="arrow" d="M360 298 V340 H780"/>
  <path class="arrow" d="M598 298 V320 H790"/>

  <rect class="dash" x="32" y="400" width="916" height="128" rx="12"/>
  <text class="label" x="48" y="428">AWS secondary / 次要</text>
  <text class="small" x="48" y="450">Parallel serverless path. Not the primary narrative. No VPC and no load balancer.</text>
  <rect class="box" x="48" y="466" width="150" height="44" rx="8"/>
  <text class="small" x="64" y="493">CodeBuild</text>
  <rect class="box" x="220" y="466" width="210" height="44" rx="8"/>
  <text class="small" x="236" y="493">API Gateway HTTP API</text>
  <rect class="box" x="452" y="466" width="150" height="44" rx="8"/>
  <text class="small" x="468" y="493">Lambda</text>
  <rect class="box" x="624" y="466" width="150" height="44" rx="8"/>
  <text class="small" x="640" y="493">CloudWatch</text>
  <rect class="box" x="796" y="466" width="130" height="44" rx="8"/>
  <text class="small" x="812" y="493">IAM / secrets</text>
</svg>
